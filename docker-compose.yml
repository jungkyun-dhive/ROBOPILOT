version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - robopilot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AWS_REGION=ap-northeast-2
      - JWT_SECRET=${JWT_SECRET:-robopilot-secret-key}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=robopilot
      - DB_USER=robopilot
      - DB_PASSWORD=robopilot
    depends_on:
      - postgres
    networks:
      - robopilot-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=robopilot
      - POSTGRES_USER=robopilot
      - POSTGRES_PASSWORD=robopilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-scripts
    networks:
      - robopilot-network

  # MQTT Broker (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - ./docker/mosquitto/data:/mosquitto/data
      - ./docker/mosquitto/log:/mosquitto/log
    networks:
      - robopilot-network

networks:
  robopilot-network:
    driver: bridge

volumes:
  postgres-data:
