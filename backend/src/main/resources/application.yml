spring:
  application:
    name: robopilot

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:robopilot}
    username: ${DB_USER:robopilot}
    password: ${DB_PASSWORD:robopilot}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # AWS Configuration
  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false

server:
  port: 8080

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:robopilot-jwt-secret-key-for-production-minimum-256-bits-required-by-hmac-sha}
  expiration: 86400000 # 24 hours in milliseconds

# Logging
logging:
  level:
    com.dhive.robopilot: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# CORS Configuration
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000,http://13.125.59.147,http://localhost
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600
