spring:
  application:
    name: robopilot

  # AWS Configuration
  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:robopilot-secret-key-change-in-production}
  expiration: 86400000 # 24 hours in milliseconds

# Logging
logging:
  level:
    com.dhive.robopilot: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# CORS Configuration
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600
